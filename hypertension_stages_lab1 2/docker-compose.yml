services:
  postgres:
    container_name: hypertension_postgres
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres1234
      POSTGRES_DB: test_db
    ports:
      - "5455:5432"
    volumes:
      - hypertension-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    container_name: hypertension_adminer
    image: adminer:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"

  minio:
    container_name: hypertension_minio
    image: quay.io/minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: rootpassword
    volumes:
      - hypertension-minio-data:/data
    command: server /data --console-address ":9001"

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    volumes:
      - ./resources/minio:/media:ro
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 root rootpassword;
      mc mb --ignore-existing local/hypertension-media;
      mc anonymous set download local/hypertension-media;
      mc cp /media/* local/hypertension-media/;
      exit 0;
      "

volumes:
  hypertension-postgres-data:
  hypertension-minio-data:
